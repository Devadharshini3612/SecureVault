# Test Configuration for SecureVault Application
# This configuration is used during testing to ensure consistent behavior

# Database Configuration - Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration for testing
jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironmentOnly123456789
jwt.expiration=86400000

# AES Encryption Configuration for testing
aes.secret.key=testAESKeyForEncryptionInTestEnvironment123456789012

# Logging Configuration for tests
logging.level.com.securevault=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Disable security for easier testing
management.security.enabled=false