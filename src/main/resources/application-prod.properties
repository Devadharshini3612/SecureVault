# -------------------------------------------------------
# SecureVault - Production Configuration (Render.com)
# -------------------------------------------------------

# Application name
spring.application.name=SecureVault

# -------------------------------------------------------
# PostgreSQL Database Connection (from Render)
# -------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------
# Hibernate / JPA Settings
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------
# Server Configuration
# -------------------------------------------------------
server.port=${SERVER_PORT:8080}

# CORS Configuration for Frontend
securevault.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://securevault-frontend.onrender.com}

# -------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration.time=${JWT_EXPIRATION_TIME:86400000}

# -------------------------------------------------------
# AES Encryption Configuration
# -------------------------------------------------------
aes.encryption.key=${AES_ENCRYPTION_KEY}

# -------------------------------------------------------
# Redis Configuration (from Render)
# -------------------------------------------------------
spring.redis.host=${SPRING_REDIS_HOST}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD}
spring.redis.database=${SPRING_REDIS_DATABASE:0}
spring.redis.timeout=${SPRING_REDIS_TIMEOUT:5000}
spring.redis.ssl.enabled=true

# Redis Connection Pool (Lettuce)
spring.redis.lettuce.pool.max-active=10
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=1
spring.redis.lettuce.pool.max-wait=2000

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# Cache-specific TTL settings (in seconds)
securevault.cache.user-profiles.ttl=7200
securevault.cache.credential-metadata.ttl=900
securevault.cache.search-results.ttl=300
securevault.cache.categories.ttl=21600
securevault.cache.performance-metrics.ttl=120
securevault.cache.auth-sessions.ttl=600

# -------------------------------------------------------
# Email Configuration (Gmail SMTP)
# -------------------------------------------------------
app.email.enabled=${EMAIL_ENABLED:true}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=${MAIL_FROM:dharshinimurali63@gmail.com}

# -------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------
logging.level.root=INFO
logging.level.com.securevault=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# -------------------------------------------------------
# Actuator (Health Check)
# -------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
management.health.db.enabled=true
