# -------------------------------------------------------
# SecureVault - Application Configuration
# -------------------------------------------------------

# Application name
spring.application.name=SecureVault

# -------------------------------------------------------
# PostgreSQL Database Connection
# -------------------------------------------------------

# Database URL - connects to the 'securevault' database on localhost
# Override with: SPRING_DATASOURCE_URL environment variable
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securevault}

# PostgreSQL username
# Override with: SPRING_DATASOURCE_USERNAME environment variable
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

# PostgreSQL password
# Override with: SPRING_DATASOURCE_PASSWORD environment variable
# IMPORTANT: Set this via environment variable in production!
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dharshini3612@}

# PostgreSQL JDBC driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------
# Hibernate / JPA Settings
# -------------------------------------------------------

# 'update' = Hibernate will automatically create or update tables
# based on your @Entity classes. Safe for development.
spring.jpa.hibernate.ddl-auto=update

# Print all SQL statements to the console (helpful for learning)
spring.jpa.show-sql=true

# Format the printed SQL for easier reading
spring.jpa.properties.hibernate.format_sql=true

# Dialect tells Hibernate which SQL flavor to generate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------
# Server
# -------------------------------------------------------

# Default port is 8080 - change if needed
# Override with: SERVER_PORT environment variable
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------

# JWT Secret Key (Base64 encoded)
# Override with: JWT_SECRET_KEY environment variable
# IMPORTANT: This MUST be set via environment variable in production!
jwt.secret.key=${JWT_SECRET_KEY:YXNkZmFzZGZhc2RmYXNkZmFzZGZhc2RmYXNkZmFzZGZhc2RmYXNkZmFzZGZhc2RmYXNkZg==}

# JWT Expiration Time (24 hours in milliseconds)
# Override with: JWT_EXPIRATION_TIME environment variable
jwt.expiration.time=${JWT_EXPIRATION_TIME:86400000}

# -------------------------------------------------------
# AES Encryption Configuration
# -------------------------------------------------------

# AES Encryption Key (Base64 encoded 256-bit key)
# Override with: AES_ENCRYPTION_KEY environment variable
# IMPORTANT: This MUST be set via environment variable in production!
aes.encryption.key=${AES_ENCRYPTION_KEY:YXNkZmFzZGZhc2RmYXNkZmFzZGZhc2Rm}

# -------------------------------------------------------
# Redis Configuration
# -------------------------------------------------------

# Redis server connection
# Override with: SPRING_REDIS_HOST environment variable
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.database=${SPRING_REDIS_DATABASE:0}

# Redis password (leave empty if no password)
# Override with: SPRING_REDIS_PASSWORD environment variable
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.timeout=${SPRING_REDIS_TIMEOUT:5000}

# Redis Connection Pool (Lettuce)
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=2000

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# Cache-specific TTL settings (in seconds)
securevault.cache.user-profiles.ttl=7200
securevault.cache.credential-metadata.ttl=900
securevault.cache.search-results.ttl=300
securevault.cache.categories.ttl=21600
securevault.cache.performance-metrics.ttl=120
securevault.cache.auth-sessions.ttl=600

# -------------------------------------------------------
# Email Configuration (SMTP)
# -------------------------------------------------------

# Enable/disable email sending
# Set to true to send real emails, false for console logging only
app.email.enabled=${EMAIL_ENABLED:true}

# SMTP Server Configuration
# For Gmail, use smtp.gmail.com with port 587
# For other providers, update accordingly
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

# Email credentials
# IMPORTANT: Use environment variables in production!
spring.mail.username=${MAIL_USERNAME:dharshinimurali63@gmail.com}
spring.mail.password=${MAIL_PASSWORD:pltfwwalplgcjckn}

# SMTP Protocol
spring.mail.protocol=smtp

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender details
spring.mail.from=${MAIL_FROM:dharshinimurali63@gmail.com}
