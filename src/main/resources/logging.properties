# ===========================================
# SecureVault Logging Configuration
# ===========================================
# 
# This file provides additional logging configuration that complements
# the logback-spring.xml configuration. It defines logging levels and
# patterns that can be easily modified without restarting the application.

# ===========================================
# ROOT LOGGING LEVEL
# ===========================================
logging.level.root=INFO

# ===========================================
# APPLICATION-SPECIFIC LOGGING LEVELS
# ===========================================
# SecureVault main application
logging.level.com.securevault=DEBUG

# Controllers - HTTP request/response logging
logging.level.com.securevault.controller=INFO

# Services - Business logic logging
logging.level.com.securevault.service=DEBUG

# Repositories - Database access logging
logging.level.com.securevault.repository=DEBUG

# Security components
logging.level.com.securevault.security=DEBUG

# Performance monitoring
logging.level.com.securevault.performance=INFO

# Utilities (reduce verbosity)
logging.level.com.securevault.util=INFO

# ===========================================
# SPRING FRAMEWORK LOGGING LEVELS
# ===========================================
# Spring Boot startup and auto-configuration
logging.level.org.springframework.boot=INFO

# Spring Web MVC (request mapping, handlers)
logging.level.org.springframework.web=INFO

# Spring Security (authentication, authorization)
logging.level.org.springframework.security=INFO

# Spring Data JPA
logging.level.org.springframework.data=INFO

# Spring Transaction management
logging.level.org.springframework.transaction=DEBUG

# Spring AOP (Aspect-Oriented Programming)
logging.level.org.springframework.aop=INFO

# ===========================================
# DATABASE AND PERSISTENCE LOGGING
# ===========================================
# Hibernate ORM
logging.level.org.hibernate=INFO

# SQL queries (set to DEBUG to see generated SQL)
logging.level.org.hibernate.SQL=DEBUG

# SQL parameter values (set to TRACE to see bind parameters)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Hibernate statistics
logging.level.org.hibernate.stat=INFO

# Connection pooling (HikariCP)
logging.level.com.zaxxer.hikari=INFO

# ===========================================
# THIRD-PARTY LIBRARY LOGGING LEVELS
# ===========================================
# Jackson JSON processing
logging.level.com.fasterxml.jackson=INFO

# Validation framework
logging.level.org.hibernate.validator=INFO

# JWT library
logging.level.io.jsonwebtoken=INFO

# Tomcat embedded server
logging.level.org.apache.tomcat=INFO
logging.level.org.apache.catalina=INFO

# ===========================================
# LOG FILE CONFIGURATION
# ===========================================
# Base directory for log files (can be overridden by environment variable)
logging.file.path=${LOG_DIR:./logs}

# Main application log file name
logging.file.name=${logging.file.path}/securevault-application.log

# ===========================================
# CONSOLE LOGGING CONFIGURATION
# ===========================================
# Console log pattern (with colors for development)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{correlationId:-}]){cyan} %clr(%-40.40logger{39}){blue} %clr(:){faint} %m%n%wEx

# File log pattern (no colors, more detailed)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n%ex

# ===========================================
# PROFILE-SPECIFIC OVERRIDES
# ===========================================
# Development profile
%dev.logging.level.com.securevault=DEBUG
%dev.logging.level.org.springframework.web=DEBUG
%dev.logging.level.org.hibernate.SQL=DEBUG
%dev.logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Test profile (minimal logging for cleaner test output)
%test.logging.level.root=WARN
%test.logging.level.com.securevault=INFO
%test.logging.level.org.springframework=WARN
%test.logging.level.org.hibernate=WARN

# Production profile (optimized for performance)
%prod.logging.level.root=INFO
%prod.logging.level.com.securevault=INFO
%prod.logging.level.org.springframework=WARN
%prod.logging.level.org.hibernate=WARN
%prod.logging.level.org.hibernate.SQL=WARN

# ===========================================
# ASYNC LOGGING CONFIGURATION
# ===========================================
# Enable async logging for better performance
logging.config.async.queue-size=1024
logging.config.async.discarding-threshold=0

# ===========================================
# ROLLING FILE CONFIGURATION
# ===========================================
# Maximum file size before rolling
logging.logback.rollingpolicy.max-file-size=50MB

# Maximum history to keep (days)
logging.logback.rollingpolicy.max-history=30

# Total size cap for all log files
logging.logback.rollingpolicy.total-size-cap=5GB

# Clean up old log files on startup
logging.logback.rollingpolicy.clean-history-on-start=true

# ===========================================
# SECURITY LOGGING CONFIGURATION
# ===========================================
# Enable security event logging
logging.level.SECURITY=INFO

# Enable audit trail logging
logging.level.AUDIT=INFO

# Performance monitoring
logging.level.PERFORMANCE=DEBUG

# ===========================================
# CUSTOM LOGGER CONFIGURATIONS
# ===========================================
# API request/response logging
logging.level.HTTP_TRACE=DEBUG

# Database query performance
logging.level.DB_PERFORMANCE=INFO

# Cache operations
logging.level.CACHE=DEBUG

# External service calls
logging.level.EXTERNAL_SERVICE=INFO

# ===========================================
# LOGGING FEATURES
# ===========================================
# Include application name in logs
logging.include-application-name=true

# Enable correlation ID tracking
logging.pattern.correlation-id=%X{correlationId:-}

# Enable thread name logging
logging.include-thread-name=true

# Enable caller location (disable in production for performance)
logging.include-caller-data=false

# ===========================================
# ERROR HANDLING
# ===========================================
# Log configuration errors
logging.exception-conversion-word=%wEx

# Include root cause in stack traces
logging.pattern.root-cause=true

# ===========================================
# MONITORING AND HEALTH
# ===========================================
# Enable JMX management for runtime log level changes
logging.jmx.enabled=true

# Health check endpoint logging
logging.level.org.springframework.boot.actuate=INFO